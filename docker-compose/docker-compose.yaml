# ============================================================
# Orgkeep demo: Keycloak, PostgreSQL, Orgkeep (API + dashboard), Mailpit, and the demo APIs of a realm owner
#
#   docker compose up -d --build
#
# Everything is described in README.md, next to this file:
# - Orgkeep (dashboard, and the API under /api) on http://localhost:8284 (realm-owner / password)
# - Keycloak on http://localhost:8280 (admin console: admin / admin), realm "demo"
# - Mailpit on http://localhost:8025: the invitation emails
# - the demo APIs: greetings-api-spring on 8290, greetings-api-vertx on 8291, gateway-go on 8292
#
# A demo, not a production setup: fixed passwords and secrets, plain HTTP, Keycloak exposed directly.
# ============================================================
name: orgkeep-demo

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Keycloak in production mode (start, not start-dev), with the orgkeep theme added (image built by orgkeep-theme)
  keycloak:
    image: ghcr.io/orgkeep/orgkeep-keycloak:${ORGKEEP_VERSION:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # The tokens are requested from the host: their issuer is http://localhost:8280/realms/demo.
      # The containers reach Keycloak through http://keycloak:8080. With BACKCHANNEL_DYNAMIC, the discovery they read
      # keeps this public issuer but gives internal URLs (jwks...) they can reach.
      KC_HOSTNAME: http://localhost:8280
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # plain HTTP: a demo on localhost, TLS belongs to a reverse proxy in a real deployment
      KC_HTTP_ENABLED: "true"

      # Admin bootstrap (first startup only)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HEALTH_ENABLED: "true"
    ports:
      - "8280:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Since Keycloak 25, /health is served on the management port 9000, not on 8080
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # The API of the core and the dashboard, a single app (image built by orgkeep-dashboard).
  # API alone, without the dashboard: image ghcr.io/orgkeep/orgkeep-core, port 8282, without
  # ORGKEEP_DASHBOARD_CLIENT_SECRET (see README.md)
  orgkeep:
    image: ghcr.io/orgkeep/orgkeep:${ORGKEEP_VERSION:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    environment:
      # Admin API and OIDC go through the internal network
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak as seen by the browser, not by the container: issuer shown to the realm owner, Swagger UI login
      ORGKEEP_KEYCLOAK_PUBLIC_URL: http://localhost:8280

      # Realm managed by Orgkeep and its initial owner (created at the first startup)
      ORGKEEP_REALM_NAME: demo
      ORGKEEP_OWNER_EMAIL: realm-owner@demo.test
      ORGKEEP_OWNER_USERNAME: realm-owner
      ORGKEEP_OWNER_PASSWORD: password
      ORGKEEP_OWNER_TEMPORARY_PASSWORD: "false"
      ORGKEEP_OWNER_FIRST_NAME: Alice
      ORGKEEP_OWNER_LAST_NAME: Martin
      # Creates the demo orgs, their members and catalogs (catalog secrets prod-demo-secret and sandbox-demo-secret)
      ORGKEEP_DEMO_ENABLED: "true"

      # The orgkeep-dashboard client is created by the demo with this secret (redirect http://localhost:8284/*)
      ORGKEEP_DASHBOARD_CLIENT_SECRET: dashboard-dev-secret
      # Login page of the dashboard in the Orgkeep look (theme of the keycloak image above)
      ORGKEEP_DASHBOARD_LOGIN_THEME: orgkeep

      # Swagger UI on http://localhost:8284/q/swagger-ui, with a username / password login
      QUARKUS_SWAGGER_UI_ENABLE: "true"
      ORGKEEP_SWAGGER_UI_LOGIN: "true"

      # Invitation emails: Keycloak sends them to Mailpit, readable on http://localhost:8025
      ORGKEEP_SMTP_HOST: mailpit
      ORGKEEP_SMTP_PORT: "1025"
      ORGKEEP_SMTP_FROM: no-reply@demo.test
      ORGKEEP_SMTP_STARTTLS: "false"
      ORGKEEP_SMTP_SSL: "false"
    ports:
      - "8284:8284"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # healthy once Orgkeep has created the realm demo: the demo APIs read its keys at startup
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/keycloak/8080 && echo -e 'GET /realms/demo HTTP/1.1\r\nHost: localhost:8280\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Catches every email of the realm (same image as compose-devservices.yml of the core)
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "8025:8025"

  # --- The demo APIs of the realm owner, built from the folders next to this one ---
  # Each one introspects the lightweight tokens with the secret of its catalog, set by the demo (prod-demo-secret).

  greetings-api-spring:
    build: ../greetings-api-spring
    image: ghcr.io/orgkeep/greetings-api-spring:${ORGKEEP_VERSION:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER: http://localhost:8280/realms/demo
      KEYCLOAK_URL: http://keycloak:8080/realms/demo
      CATALOG_CLIENT_SECRET: prod-demo-secret
    ports:
      - "8290:8290"
    depends_on:
      orgkeep:
        condition: service_healthy

  greetings-api-vertx:
    build: ../greetings-api-vertx
    image: ghcr.io/orgkeep/greetings-api-vertx:${ORGKEEP_VERSION:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER: http://localhost:8280/realms/demo
      KEYCLOAK_URL: http://keycloak:8080/realms/demo
      CATALOG_CLIENT_SECRET: prod-demo-secret
    ports:
      - "8291:8291"
    depends_on:
      orgkeep:
        condition: service_healthy

  # In front of greetings-api-spring: swaps the lightweight tokens for full ones (phantom token)
  gateway-go:
    build: ../gateway-go
    image: ghcr.io/orgkeep/gateway-go:${ORGKEEP_VERSION:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER: http://localhost:8280/realms/demo
      KEYCLOAK_URL: http://keycloak:8080/realms/demo
      UPSTREAM: http://greetings-api-spring:8290
      CATALOG_SECRETS: prod=prod-demo-secret,sandbox=sandbox-demo-secret
    ports:
      - "8292:8292"
    depends_on:
      orgkeep:
        condition: service_healthy
      greetings-api-spring:
        condition: service_started

volumes:
  postgres_data:
