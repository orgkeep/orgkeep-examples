# The greetings API of the realm owner, for the catalog prod of the demo realm of Orgkeep.
# Full and lightweight tokens on the same API, chosen token by token by the marker "lightweight": true (SecurityConfig).
spring.application.name=greetings-api-spring
# ports in dev: Keycloak 8280, Orgkeep 8282 to 8284, the demo APIs from 8290
server.port=8290

# the Keycloak of the demo (mvn quarkus:dev in orgkeep-dashboard, or the demo compose), realm "demo":
# the issuer of the tokens, as the browsers see Keycloak (environment variable KEYCLOAK_ISSUER)
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8280/realms/demo}
# the same realm as this API reaches it, for the keys (JWKS) and the introspection: the issuer by default, an internal
# URL in Docker (http://keycloak:8080/realms/demo in the demo compose), where localhost is the container itself
keycloak.url=${KEYCLOAK_URL:${keycloak.issuer}}

# the catalog of this API: its rights are in resource_access.<catalog>, its quotas in the claim <catalog>
demo.catalog=${CATALOG:prod}
# the secret of the catalog client, to introspect the lightweight tokens (Keycloak only lets the catalog client
# introspect the tokens of its catalog). Generated in the dashboard (page of the catalog, "Generate a secret"),
# never written in this file. Without it, only full tokens are accepted
demo.catalog-secret=${CATALOG_CLIENT_SECRET:}

# the introspection calls and the cache hits
logging.level.io.orgkeep.demo=DEBUG
